apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: apps/hermes
        property: openrouter_key
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: apps/hermes
        property: discord_token
    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: apps/hermes
        property: discord_allowed_users
