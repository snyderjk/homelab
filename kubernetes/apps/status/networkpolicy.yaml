# Public-facing: only the gateway may reach it; it may only talk to the API server (+DNS).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: status
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: status
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-ingress
            gateway.networking.k8s.io/gateway-name: homelab
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
