# Pulls models into the running server (idempotent: already-present models are a no-op).
# Edit the list to add/remove. Runs as a PostSync hook: Argo deletes and recreates it after
# every sync instead of diffing it (Job templates are immutable, so an image bump made the
# server-side diff fail with "field is immutable" and blocked the whole app).
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10 # the server may still be starting / pulling its image
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull-models
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          image: ollama/ollama:0.40.19
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for m in llama3.2:3b; do
                echo "pulling $m"; ollama pull "$m"
              done
              ollama list
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
