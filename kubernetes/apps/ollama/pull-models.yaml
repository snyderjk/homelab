# Pulls models into the running server (idempotent: already-present models are a no-op).
# Edit the list to add/remove; Replace=true makes Argo recreate the (immutable) Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 10 # the server may still be starting / pulling its image
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull-models
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          image: ollama/ollama:0.40.13
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for m in llama3.2:3b; do
                echo "pulling $m"; ollama pull "$m"
              done
              ollama list
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
