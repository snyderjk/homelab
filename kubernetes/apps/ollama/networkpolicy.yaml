# In: the gateway (LAN) and any pod in the cluster (future apps: n8n, OpenClaw, ...).
# Out: DNS + HTTPS (model downloads from registry.ollama.ai and its CDN).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ollama
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  ingress:
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - {port: "11434", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
