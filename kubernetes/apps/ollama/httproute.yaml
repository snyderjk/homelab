# LAN + WireGuard only (split DNS → gateway). Deliberately no Pangolin resource:
# Ollama's API is unauthenticated.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - ollama.snyderhomelab.com
  rules:
    - backendRefs:
        - name: ollama
          port: 11434
      timeouts:
        request: 300s # long generations
