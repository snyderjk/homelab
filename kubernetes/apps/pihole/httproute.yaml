# Admin UI — LAN + WireGuard only (no Pangolin resource)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - pihole.snyderhomelab.com
  rules:
    - matches:
        - path: {type: Exact, value: /}
      filters:
        - type: RequestRedirect
          requestRedirect: {path: {type: ReplaceFullPath, replaceFullPath: /admin/}, statusCode: 302}
    - backendRefs:
        - name: pihole-web
          port: 80
