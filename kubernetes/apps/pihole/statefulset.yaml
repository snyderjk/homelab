# Two independent Pi-hole instances on different nodes, each with its own local NVMe volume
# (local-path) — no NAS dependency. Both answer DNS behind 10.77.1.202, so one pod, node, or
# the NAS failing doesn't take DNS down. pihole-0 is the primary (the only one you edit, via
# the UI); nebula-sync copies lists/groups/local DNS from pihole-0 to pihole-1.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pihole
  labels: {app.kubernetes.io/name: pihole}
spec:
  serviceName: pihole
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: pihole}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pihole}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: pihole}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pihole
          image: docker.io/pihole/pihole:2026.11.0
          env:
            - {name: TZ, value: America/Chicago}
            # FTLCONF_* settings are enforced from here (shown read-only in the UI)
            - {name: FTLCONF_dns_upstreams, value: "10.77.1.1"}      # pfSense unbound
            - {name: FTLCONF_dns_listeningMode, value: "ALL"}        # clients on other VLANs + WireGuard
            # built-in NTP server/client: not needed (and lacks CAP_SYS_TIME in a pod)
            - {name: FTLCONF_ntp_ipv4_active, value: "false"}
            - {name: FTLCONF_ntp_ipv6_active, value: "false"}
            - {name: FTLCONF_ntp_sync_active, value: "false"}
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef: {name: pihole-admin, key: password}
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: http, containerPort: 80, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: dns-tcp}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /admin/, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            # start.sh uses capsh to drop to the pihole user with only the caps FTL needs;
            # no_new_privs (allowPrivilegeEscalation: false) can interfere, so leave it at default
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: etc, mountPath: /etc/pihole}
  volumeClaimTemplates:
    - metadata:
        name: etc
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pihole
spec:
  maxUnavailable: 1     # node drains take one Pi-hole at a time
  selector:
    matchLabels: {app.kubernetes.io/name: pihole}
