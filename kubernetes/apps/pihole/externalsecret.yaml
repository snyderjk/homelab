# Web/API password, from Vault: secret/pihole/admin {password}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-admin
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: pihole-admin}
  data:
    - secretKey: password
      remoteRef: {key: pihole/admin, property: password}
