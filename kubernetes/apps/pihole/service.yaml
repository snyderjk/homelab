# DNS on a fixed LAN IP. externalTrafficPolicy must be Cluster: Cilium's L2 announcement
# picks the announcing node without regard to where the pod runs, so with Local the
# announcing node often has no backend and refuses queries. Cost: Pi-hole sees node IPs,
# not real client IPs (per-device stats). Fixing that needs Cilium DSR (cluster-wide).
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  annotations:
    lbipam.cilium.io/ips: 10.77.1.202
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector: {app.kubernetes.io/name: pihole}
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
spec:
  selector: {app.kubernetes.io/name: pihole}
  ports:
    - {name: http, port: 80, targetPort: http}
