# DNS on a fixed LAN IP, load-balanced across BOTH Pi-holes. externalTrafficPolicy must be
# Cluster: Cilium's L2 announcement picks the announcing node without regard to where the
# pods run, so with Local the announcing node may have no backend and refuse queries.
# Cost: Pi-hole sees node IPs, not real client IPs. Fixing that needs Cilium DSR.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  annotations:
    lbipam.cilium.io/ips: 10.77.1.202
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector: {app.kubernetes.io/name: pihole}
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
---
# Web UI / API -> primary only (pihole-0). Changes made here are synced to pihole-1.
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
spec:
  selector:
    app.kubernetes.io/name: pihole
    statefulset.kubernetes.io/pod-name: pihole-0
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Headless: stable per-pod DNS names (pihole-0.pihole.pihole.svc) for nebula-sync
apiVersion: v1
kind: Service
metadata:
  name: pihole
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: pihole}
  ports:
    - {name: http, port: 80, targetPort: http}
