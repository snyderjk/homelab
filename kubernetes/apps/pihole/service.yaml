# DNS on a fixed LAN IP. externalTrafficPolicy: Local keeps the real client IP (per-client
# stats and groups); Cilium only announces the IP from the node running the pod.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  annotations:
    lbipam.cilium.io/ips: 10.77.1.202
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: pihole}
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
spec:
  selector: {app.kubernetes.io/name: pihole}
  ports:
    - {name: http, port: 80, targetPort: http}
