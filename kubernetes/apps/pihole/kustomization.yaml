# Pi-hole: LAN DNS + ad blocking at 10.77.1.202 (UDP/TCP 53), upstream = pfSense unbound
# (keeps split DNS for *.snyderhomelab.com). Admin UI: https://pihole.snyderhomelab.com (LAN/VPN).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pihole
resources:
  - namespace.yaml
  - externalsecret.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
