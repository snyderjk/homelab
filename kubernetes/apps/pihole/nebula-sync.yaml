# Replicates pihole-0 (primary) -> pihole-1 every 5 minutes: adlists, allow/deny lists,
# groups, clients, local DNS records/CNAMEs; then rebuilds gravity on the replica.
# Granular sync (not Teleporter full sync) so the FTLCONF_* env-locked keys are left alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  labels: {app.kubernetes.io/name: nebula-sync}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nebula-sync}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nebula-sync}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nebula-sync
          image: ghcr.io/lovelaze/nebula-sync:v0.11.3
          env:
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef: {name: pihole-admin, key: password}
            # $(VAR) is expanded by Kubernetes from the env var above
            - {name: PRIMARY, value: "http://pihole-0.pihole.pihole.svc.cluster.local|$(PIHOLE_PASSWORD)"}
            - {name: REPLICAS, value: "http://pihole-1.pihole.pihole.svc.cluster.local|$(PIHOLE_PASSWORD)"}
            - {name: CRON, value: "*/5 * * * *"}
            - {name: TZ, value: America/Chicago}
            - {name: RUN_GRAVITY, value: "true"}
            - {name: FULL_SYNC, value: "false"}
            - {name: SYNC_CONFIG_DNS, value: "true"}            # local DNS records, CNAMEs, etc.
            - {name: SYNC_CONFIG_DNS_EXCLUDE, value: "upstreams,listeningMode"}   # env-locked
            - {name: SYNC_GRAVITY_GROUP, value: "true"}
            - {name: SYNC_GRAVITY_AD_LIST, value: "true"}
            - {name: SYNC_GRAVITY_AD_LIST_BY_GROUP, value: "true"}
            - {name: SYNC_GRAVITY_DOMAIN_LIST, value: "true"}
            - {name: SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP, value: "true"}
            - {name: SYNC_GRAVITY_CLIENT, value: "true"}
            - {name: SYNC_GRAVITY_CLIENT_BY_GROUP, value: "true"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
