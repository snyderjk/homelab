# Widget credentials, exposed to Homepage as HOMEPAGE_VAR_* and referenced as
# {{HOMEPAGE_VAR_...}} in route annotations. Reuses existing Vault entries.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-widgets
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: homepage-widgets}
  data:
    - secretKey: HOMEPAGE_VAR_PIHOLE_KEY
      remoteRef: {key: pihole/admin, property: password}
    - secretKey: HOMEPAGE_VAR_GRAFANA_USER
      remoteRef: {key: monitoring/grafana, property: username}
    - secretKey: HOMEPAGE_VAR_GRAFANA_PASS
      remoteRef: {key: monitoring/grafana, property: password}
