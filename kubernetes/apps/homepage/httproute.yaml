# LAN: split DNS -> gateway. Public: Pangolin resource with SSO ON.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - home.snyderhomelab.com
  rules:
    - backendRefs:
        - name: homepage
          port: 80
