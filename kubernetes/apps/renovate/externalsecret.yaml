# GitHub App credentials (created by hand, stored in Vault secret/renovate/github)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: renovate-github-app}
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: {key: renovate/github, property: app_id}
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: {key: renovate/github, property: private_key}
