# NVIDIA DCGM exporter on k8s-gpu01: GPU utilization, VRAM, temperature, power, clocks,
# with the pod/namespace using the GPU (kubelet pod-resources). Doesn't request a GPU
# itself, so it never takes the card away from Ollama.
runtimeClassName: nvidia   # RuntimeClass adds the gpu01 nodeSelector + taint toleration
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  # No SYS_ADMIN: that's only for DCGM_FI_PROF_* profiling counters, which GeForce/laptop
  # GPUs don't support anyway.
  capabilities: {drop: [ALL]}
  allowPrivilegeEscalation: false
  seccompProfile: {type: RuntimeDefault}
# DaemonSet placement is decided before the RuntimeClass adds its nodeSelector/toleration,
# so spell both out: only the GPU node, tolerate its taint.
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: homelab.snyderhomelab.com/gpu
              operator: Exists
serviceMonitor:
  enabled: true
  interval: 30s
