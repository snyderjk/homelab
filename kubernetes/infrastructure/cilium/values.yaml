# Cilium Helm values for Talos (kube-proxy replacement via KubePrism)
# Managed by Argo CD: kubernetes/argocd/infrastructure/cilium.yaml
# Original manual install (before Argo):
#   helm repo add cilium https://helm.cilium.io && helm repo update
#   helm install cilium cilium/cilium --version 1.19.10 -n kube-system -f cilium-values.yaml
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: localhost # KubePrism
k8sServicePort: 7445

# Talos mounts cgroupv2 itself and blocks module loading from pods (no SYS_MODULE)
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# Talos hostDNS forwardKubeDNSToHost is on. If you enable bpf.masquerade,
# you must also set bpf.hostLegacyRouting: true or DNS from pods breaks.
# bpf:
#   masquerade: true
#   hostLegacyRouting: true

# Roll agent/operator pods automatically when cilium-config changes, so config
# changes pushed through Argo take effect without a manual rollout restart.
rollOutCiliumPods: true
operator:
  replicas: 2
  rollOutPods: true

# LoadBalancer IPs: Cilium LB IPAM + L2 (ARP) announcements, replacing MetalLB.
# Pool + announcement policy: kubernetes/infrastructure/cilium/config/
l2announcements:
  enabled: true
# Each announced service holds a Lease per node; raise the API client limits
# so lease renewals don't get throttled as the number of LB services grows.
k8sClientRateLimit:
  qps: 25
  burst: 50

hubble:
  # Hubble mTLS certs issued by cert-manager from the internal homelab-ca
  # (kubernetes/infrastructure/cert-manager/config/homelab-ca.yaml). Never use the
  # default "helm" method under Argo: every render would mint new certs.
  # Only Hubble observability depends on this — pod networking does not.
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: homelab-ca
  relay:
    enabled: true
  ui:
    enabled: true

# Istio (ambient or sidecar) alongside Cilium:
# - don't let Cilium remove other CNI configs; istio-cni chains itself onto Cilium's
cni:
  exclusive: false
# - with kube-proxy replacement, do service load-balancing for pods at the
#   veth/tc layer instead of the pod's socket, so Istio sees the original
#   service IP and can redirect traffic into the mesh
socketLB:
  hostNamespaceOnly: true
# Gateway API is implemented by Istio, so Cilium's gatewayAPI stays disabled
# (two controllers for the same GatewayClass/Gateways would fight).
