# istio/istiod — ambient mode (chart keys are top-level, not under pilot:)
profile: ambient

# Chart default requests 500m / 2Gi, sized for big clusters. Plenty for a homelab;
# the HPA still scales out under load.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
autoscaleMin: 2 # survives a control-plane reboot without a control-plane gap
autoscaleMax: 3
