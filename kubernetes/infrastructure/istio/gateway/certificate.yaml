# Wildcard cert for the gateway's HTTPS listener. Used by LAN clients (pfSense split
# DNS -> 10.77.1.201) and by Pangolin/Newt (which connects with SNI = the hostname).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-snyderhomelab
  namespace: istio-ingress
spec:
  secretName: wildcard-snyderhomelab-tls
  dnsNames:
    - "*.snyderhomelab.com"
    - snyderhomelab.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
