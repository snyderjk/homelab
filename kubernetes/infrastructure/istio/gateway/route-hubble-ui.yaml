# hubble.snyderhomelab.com -> Hubble UI. Hubble UI has NO auth of its own:
# LAN access is open; public access must stay behind Pangolin SSO.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - hubble.snyderhomelab.com
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
