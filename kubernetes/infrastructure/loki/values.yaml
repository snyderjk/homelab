# Loki single-binary, filesystem storage on local-path (u-local NVMe). 14 days of logs.
# One cluster, low volume — no object store, no microservices, no memcached.
deploymentMode: SingleBinary

loki:
  auth_enabled: false          # single tenant ("fake")
  podSecurityContext:          # chart defaults + seccomp (PSA restricted-clean)
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 336h     # 14d
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    volume_enabled: true
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true              # Grafana "Logs Drilldown" patterns

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 50Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}

# SimpleScalable components off
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}

gateway: {enabled: false}      # Alloy/Grafana talk to loki:3100 directly
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}

monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true              # picked up by kube-prometheus-stack's Grafana sidecar
  rules:
    enabled: true
