apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-localpv
  namespace: kube-system
spec:
  releaseName: openebs-localpv
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: "4.5.0"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  values:
    hostpathClass:
      enabled: true
      isDefaultClass: false
      basePath: "/var/openebs/local"
