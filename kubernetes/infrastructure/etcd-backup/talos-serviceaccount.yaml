# Talos issues a client cert limited to os:etcd:backup into Secret "talos-etcd-backup"
# (key: config = talosconfig). Allowed by machine.features.kubernetesTalosAPIAccess
# in talos/patches/controlplane.yaml (namespace etcd-backup only).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-etcd-backup
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
