apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-provisioner
spec:
  interval: 30m
  chart:
    spec:
      chart: local-path-provisioner
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
        namespace: local-path-provisioner
      interval: 12h
  values:
    storageClass:
      name: local-path
      defaultClass: false
    nodePathMap:
      - node: DEFAULT
        paths:
          - /opt/local-path-provisioner
