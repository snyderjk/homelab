# Nightly Raft snapshot → S3 (vault-homelab-vault-backups-840296800572, versioned + SSE).
#  1. init "snapshot" (vault CLI): Kubernetes-auth login as role "vault-backup"
#     (policy: read sys/storage/raft/snapshot only), save + inspect the snapshot
#  2. "upload" (aws-cli): copy to S3 with the vault-aws-creds IAM key (bucket-scoped)
# No root token anywhere. Restore needs the snapshot + the KMS key (auto-unseal).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
spec:
  schedule: "0 3 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-backup
        spec:
          serviceAccountName: vault-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: snapshot
              image: hashicorp/vault:2.2.1
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  export VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                    role=vault-backup jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)"
                  f="/backup/vault-$(date -u +%Y%m%d-%H%M%S).snap"
                  vault operator raft snapshot save "$f"
                  vault operator raft snapshot inspect "$f" | head -20
                  ls -la /backup
              env:
                - {name: VAULT_ADDR, value: "https://vault-active.vault.svc:8200"}
                - {name: VAULT_CACERT, value: /ca/ca.crt}
                - {name: HOME, value: /tmp}
                - {name: SKIP_SETCAP, value: "true"}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: ca, mountPath: /ca, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: upload
              image: amazon/aws-cli:2.39.3
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  f="$(ls /backup/*.snap)"
                  [ -s "$f" ] || { echo "empty snapshot"; exit 1; }
                  aws s3 cp "$f" "s3://vault-homelab-vault-backups-840296800572/snapshots/$(basename "$f")" \
                    --sse AES256 --only-show-errors
                  echo "uploaded $(basename "$f") ($(wc -c < "$f") bytes)"
                  aws s3 ls s3://vault-homelab-vault-backups-840296800572/snapshots/ | tail -3
              env:
                - {name: HOME, value: /tmp}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: vault-aws-creds, key: AWS_ACCESS_KEY_ID}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: vault-aws-creds, key: AWS_SECRET_ACCESS_KEY}}
                - name: AWS_REGION
                  valueFrom: {secretKeyRef: {name: vault-aws-creds, key: AWS_REGION}}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backup
              emptyDir: {sizeLimit: 1Gi}
            - name: tmp
              emptyDir: {}
            - name: ca
              configMap: {name: homelab-ca}
