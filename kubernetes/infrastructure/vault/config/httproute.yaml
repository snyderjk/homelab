# vault.snyderhomelab.com — LAN + WireGuard only (no Pangolin resource).
# Gateway terminates the public wildcard cert, then re-encrypts to Vault (homelab-ca).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - vault.snyderhomelab.com
  rules:
    - backendRefs:
        - name: vault-active # always the Raft leader
          port: 8200
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: vault-active
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: vault-active
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: homelab-ca
    hostname: vault-active.vault.svc
