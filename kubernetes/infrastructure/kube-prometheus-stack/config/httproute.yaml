# grafana.snyderhomelab.com — LAN + WireGuard for now (add a Pangolin resource later if wanted)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "grafana.png"
    gethomepage.dev/description: "Dashboards + logs (LAN / VPN)"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
    gethomepage.dev/widget.type: "grafana"
    gethomepage.dev/widget.version: "2"
    gethomepage.dev/widget.url: "http://kube-prometheus-stack-grafana.monitoring.svc"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - grafana.snyderhomelab.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
# alertmanager.snyderhomelab.com / prometheus.snyderhomelab.com — LAN + WireGuard only.
# Neither UI has auth; never add Pangolin resources for these without SSO.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - alertmanager.snyderhomelab.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Prometheus"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "prometheus.png"
    gethomepage.dev/description: "Metrics (LAN / VPN)"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=prometheus"
    gethomepage.dev/widget.type: "prometheus"
    gethomepage.dev/widget.url: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
spec:
  parentRefs:
    - name: homelab
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - prometheus.snyderhomelab.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
