# kube-prometheus-stack: Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics
# Data on local-path (u-local NVMe). Monitoring history is disposable; losing a node loses history only.

crds:
  enabled: true

# --- Talos control plane (CP patch exposes these on the node IPs) ---
# Argo CD excludes Endpoints/EndpointSlices, so the chart's static `endpoints:` lists
# never get applied. Instead:
#  - scheduler / controller-manager: host-network static pods → Services select them
#    (chart default selector `component: kube-…` when endpoints is empty)
#  - etcd is a Talos service, not a pod → config/etcd-scrapeconfig.yaml (job "kube-etcd")
kubeEtcd:
  enabled: true          # keeps the etcd rules + dashboard
  service: {enabled: false}
  serviceMonitor: {enabled: false}
kubeControllerManager: {}
kubeScheduler: {}
kubeProxy:
  enabled: false   # Cilium kube-proxy replacement

defaultRules:
  rules:
    kubeProxy: false

prometheus:
  prometheusSpec:
    # pick up every ServiceMonitor/PodMonitor/rule in the cluster, not just this chart's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 40GB
    resources:
      requests: {cpu: 300m, memory: 2Gi}
      limits: {memory: 4Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 50Gi}}

alertmanager:
  alertmanagerSpec:
    # Pushover user key + app token (ExternalSecret config/pushover.yaml), mounted at
    # /etc/alertmanager/secrets/alertmanager-pushover/{user_key,token}
    secrets: [alertmanager-pushover]
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 2Gi}}
  config:
    global:
      resolve_timeout: 5m
    # chart defaults: a critical alert silences the matching warning/info, etc.
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [namespace]
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      receiver: pushover
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # always-firing heartbeat / meta alerts: never notify
        - receiver: 'null'
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        # info-level alerts stay in the UI only
        - receiver: 'null'
          matchers: ['severity =~ "info|none"']
    receivers:
      - name: 'null'
      - name: pushover
        pushover_configs:
          - user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user_key
            token_file: /etc/alertmanager/secrets/alertmanager-pushover/token
            send_resolved: true
            # critical = high priority (bypasses quiet hours); warning = normal
            priority: '{{ if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}'
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            message: |-
              {{ range .Alerts }}{{ if .Labels.namespace }}{{ .Labels.namespace }}: {{ end }}{{ or .Annotations.summary .Annotations.description }}
              {{ end }}
            url: https://alertmanager.snyderhomelab.com
            url_title: Alertmanager
    templates:
      - '/etc/alertmanager/config/*.tmpl'

grafana:
  defaultDashboardsTimezone: America/Chicago
  admin:
    existingSecret: grafana-admin   # ExternalSecret from Vault secret/monitoring/grafana
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.snyderhomelab.com
    analytics:
      check_for_updates: false
      reporting_enabled: false
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc:3100
      jsonData:
        maxLines: 1000
  # Stateless: dashboards come from ConfigMaps (sidecar), datasources from values.
  persistence:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
