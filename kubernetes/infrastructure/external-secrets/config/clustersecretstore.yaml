# Cluster-wide store backed by Vault KV v2 at "secret/". Apps reference it:
#   secretStoreRef: {kind: ClusterSecretStore, name: vault}
#   remoteRef: {key: <app>/<name>, property: <field>}   # → secret/data/<app>/<name>
# Auth: Kubernetes auth method, role "external-secrets" (bootstrap in vault README).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after the chart's CRDs
spec:
  provider:
    vault:
      server: https://vault-active.vault.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: homelab-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
