# IAM user cnpg-backup (scoped to the bucket), created by hand; key in Vault secret/cnpg/s3
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: cnpg-s3
    template:
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
        AWS_REGION: us-east-1
  data:
    - secretKey: access_key_id
      remoteRef: {key: cnpg/s3, property: access_key_id}
    - secretKey: secret_access_key
      remoteRef: {key: cnpg/s3, property: secret_access_key}
