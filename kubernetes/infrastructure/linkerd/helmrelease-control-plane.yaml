apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-control-plane
  namespace: linkerd
spec:
  interval: 1h
  chart:
    spec:
      chart: linkerd-control-plane
      version: "2026.5.3"
      sourceRef:
        kind: HelmRepository
        name: linkerd
        namespace: flux-system
      interval: 12h
  values:
    identity:
      externalCA: true
      issuer:
        scheme: kubernetes.io/tls
