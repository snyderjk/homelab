# Talos machine + kernel logs -> Loki (Vector DaemonSet, see talos/patches/logging.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-logs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/snyderjk/homelab
    targetRevision: main
    path: kubernetes/infrastructure/talos-logs
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
