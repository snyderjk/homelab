apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6" # after Vault/ESO (Grafana admin secret)
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/kubernetes/infrastructure/kube-prometheus-stack/values.yaml
    # Grafana admin ExternalSecret + HTTPRoute
    - repoURL: https://github.com/snyderjk/homelab
      targetRevision: main
      path: kubernetes/infrastructure/kube-prometheus-stack/config
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # node-exporter needs hostNetwork/hostPID/hostPath
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRDs are too large for client-side apply annotations
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
