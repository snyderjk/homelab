# Nightly etcd snapshots -> NAS (needs talos/patches/controlplane.yaml kubernetesTalosAPIAccess)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: etcd-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/snyderjk/homelab
    targetRevision: main
    path: kubernetes/infrastructure/etcd-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: etcd-backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
