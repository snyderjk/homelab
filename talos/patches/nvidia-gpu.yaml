# NVIDIA OSS driver modules. Drivers + container toolkit come from the node's schematic
# extensions (nvidia-open-gpu-kernel-modules-lts / nvidia-container-toolkit-lts — the
# driver versions must match).
# Talos 1.14 docs use KernelModuleConfig documents, but talhelper (archived) can't parse
# that kind yet; machine.kernel.modules is the equivalent legacy form.
machine:
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
        # Hand the panel/console to nvidia-drm (instead of simpledrm) so consoleblank can
        # really power the lid-closed panel off. Must be a module parameter: Talos loads
        # modules itself, so nvidia_drm.modeset=1 on the kernel cmdline is ignored.
        parameters:
          - modeset=1
          - fbdev=1
      - name: nvidia_modeset
